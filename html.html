<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <title>Verificado</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        font-family: 'Poppins', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        position: relative;
        overflow: hidden;
      }

      .box {
        background: rgba(255, 255, 255, 0.06);
        padding: 40px 60px;
        border-radius: 20px;
        box-shadow: 0 15px 25px rgba(0, 0, 0, 0.3);
        text-align: center;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        z-index: 2;
      }

      .box h1 {
        font-size: 2em;
        margin-top: 20px;
        color: #00ffb3;
      }

      .checkmark {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 4px solid #00ffb3;
        animation: pop 0.4s ease-out;
        margin: 0 auto;
      }

      .checkmark svg {
        width: 40px;
        height: 40px;
        stroke: #00ffb3;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: draw 0.6s ease forwards 0.3s;
      }

      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes pop {
        from {
          transform: scale(0.8);
          opacity: 0;
        }

        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .marca-dagua {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 2.5em;
        color: rgba(255, 255, 255, 0.06);
        pointer-events: none;
        white-space: nowrap;
        z-index: 0;
        user-select: none;
      }

      .direitos {
        position: fixed;
        bottom: 10px;
        right: 15px;
        font-size: 0.9em;
        color: rgba(255, 255, 255, 0.3);
        z-index: 1;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div class="marca-dagua">Criado por XZ Apps</div>
    <div class="box">
      <div class="checkmark">
        <svg viewBox="0 0 52 52">
          <polyline points="14,28 22,36 38,18" />
        </svg>
      </div>
      <h1>Você foi verificado</h1>
    </div>
    <div class="direitos">Todos os direitos reservados © XZ Apps</div>
  </body>
</html>
